<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ComuniCAP</title>
<meta name="theme-color" content="#1E3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', Arial, sans-serif;
    background: #f0f4ff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .container {
    text-align: center;
    padding: 40px 24px;
    max-width: 360px;
    width: 100%;
  }
  .logo {
    font-size: 64px;
    margin-bottom: 16px;
  }
  .title {
    font-size: 22px;
    font-weight: 900;
    color: #1a1a2e;
    margin-bottom: 8px;
  }
  .msg {
    font-size: 15px;
    font-weight: 700;
    color: #555577;
    margin-bottom: 32px;
    min-height: 24px;
  }

  /* LOGIN FORM */
  #login-box { display: flex; flex-direction: column; gap: 12px; }
  input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #d0d8f0;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    color: #1a1a2e;
    background: #fff;
    outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #3a86ff; }
  .btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #3a86ff, #2667cc);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.5px;
    transition: opacity .2s;
  }
  .btn:active { opacity: 0.85; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error {
    color: #ef4444;
    font-size: 13px;
    font-weight: 700;
    margin-top: 4px;
  }

  /* SPINNER */
  #loading-box { display: none; flex-direction: column; align-items: center; gap: 16px; }
  .spinner {
    width: 48px; height: 48px;
    border: 5px solid #d0d8f0;
    border-top-color: #3a86ff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* SIN LICENCIA */
  #blocked-box {
    display: none;
    background: #fff0f0;
    border: 2px solid #fca5a5;
    border-radius: 16px;
    padding: 24px;
    text-align: center;
  }
  #blocked-box .block-icon { font-size: 48px; margin-bottom: 12px; }
  #blocked-box .block-title { font-size: 17px; font-weight: 900; color: #991b1b; margin-bottom: 8px; }
  #blocked-box .block-desc { font-size: 13px; font-weight: 700; color: #7f1d1d; line-height: 1.5; }
  .logout-btn {
    margin-top: 16px;
    padding: 10px 20px;
    background: #ef4444;
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">💬</div>
  <div class="title">ComuniCAP</div>
  <div class="msg" id="msg">Iniciá sesión para continuar</div>

  <!-- LOGIN -->
  <div id="login-box">
    <input type="email" id="email" placeholder="Email" autocomplete="email" />
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" />
    <div class="error" id="error-msg"></div>
    <button class="btn" id="login-btn" onclick="doLogin()">Entrar</button>
  </div>

  <!-- CARGANDO -->
  <div id="loading-box">
    <div class="spinner"></div>
    <div style="font-size:14px;font-weight:700;color:#555577;">Verificando licencia...</div>
  </div>

  <!-- SIN LICENCIA -->
  <div id="blocked-box">
    <div class="block-icon">🔒</div>
    <div class="block-title">Sin licencia activa</div>
    <div class="block-desc">Tu cuenta no tiene una licencia asignada.<br>Contactá a Adriana Soba para activar tu acceso.</div>
    <button class="logout-btn" onclick="doLogout()">Cerrar sesión</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lgpqyjevdwstbnerawmp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxncHF5amV2ZHdzdGJuZXJhd21wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzM1OTgsImV4cCI6MjA5MjgwOTU5OH0.GMPbwHdxj_aRLaJgDHCkDA5L1KHAwLJLkO9LYOpI8pA';

function show(id) {
  ['login-box','loading-box','blocked-box'].forEach(b => {
    document.getElementById(b).style.display = 'none';
  });
  if (id === 'loading-box') {
    document.getElementById('loading-box').style.display = 'flex';
  } else if (id === 'login-box') {
    document.getElementById('login-box').style.display = 'flex';
    document.getElementById('login-box').style.flexDirection = 'column';
  } else {
    document.getElementById(id).style.display = 'block';
  }
}

async function getSession() {
  try {
    const stored = localStorage.getItem('sb_session');
    if (!stored) return null;
    const session = JSON.parse(stored);
    if (session.expires_at && Date.now() / 1000 > session.expires_at - 60) {
      localStorage.removeItem('sb_session');
      return null;
    }
    return session;
  } catch(e) { return null; }
}

async function checkLicenseAndRedirect(accessToken, userEmail) {
  show('loading-box');
  document.getElementById('msg').textContent = 'Verificando licencia...';

  try {
    // Buscar licencia por email en tabla licencias2
    const res = await fetch(
      SUPABASE_URL + '/rest/v1/licencias2?email=eq.' + encodeURIComponent(userEmail) + '&select=clave,activa,tipo',
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + accessToken
        }
      }
    );
    const data = await res.json();

    if (!data || data.length === 0 || !data[0].activa) {
      show('blocked-box');
      document.getElementById('msg').textContent = '';
      return;
    }

    const tipo = (data[0].tipo || '').toLowerCase();

    if (tipo === 'pro') {
      window.location.replace('comunipro.html');
    } else {
      window.location.replace('comunicap.html');
    }

  } catch(e) {
    show('login-box');
    document.getElementById('msg').textContent = 'Error de conexión. Revisá el internet.';
  }
}

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;
  const errEl = document.getElementById('error-msg');
  const btn   = document.getElementById('login-btn');

  errEl.textContent = '';

  if (!email || !pass) {
    errEl.textContent = 'Completá email y contraseña';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Entrando...';
  show('loading-box');
  document.getElementById('msg').textContent = 'Iniciando sesión...';

  try {
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({ email, password: pass })
    });
    const data = await res.json();

    if (data.error || !data.access_token) {
      show('login-box');
      document.getElementById('msg').textContent = 'Iniciá sesión para continuar';
      errEl.textContent = 'Email o contraseña incorrectos';
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }

    // Guardar sesión
    localStorage.setItem('sb_session', JSON.stringify({
      access_token: data.access_token,
      email: email,
      expires_at: data.expires_at || (Date.now()/1000 + 3600)
    }));

    await checkLicenseAndRedirect(data.access_token, email);

  } catch(e) {
    show('login-box');
    document.getElementById('msg').textContent = 'Error de conexión';
    errEl.textContent = 'No se pudo conectar. Revisá el internet.';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

function doLogout() {
  localStorage.removeItem('sb_session');
  show('login-box');
  document.getElementById('msg').textContent = 'Iniciá sesión para continuar';
  document.getElementById('error-msg').textContent = '';
}

// Al abrir la app: verificar si ya hay sesión
window.addEventListener('load', async () => {
  const session = await getSession();
  if (session && session.access_token && session.email) {
    await checkLicenseAndRedirect(session.access_token, session.email);
  } else {
    show('login-box');
  }
});

// Enter para login
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
